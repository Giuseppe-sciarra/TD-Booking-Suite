{% if t.logo %}<img class="client-logo {{ size }}" src="{% url 'brand_logo' t.slug %}" alt="">{% else %}<svg class="client-logo {{ size }}" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="{{ t.brand_color }}"/><text x="24" y="31.5" text-anchor="middle">{{ t.name|first|upper }}</text></svg>{% endif %}
