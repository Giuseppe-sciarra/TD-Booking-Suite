<tr><td><input name="desc" maxlength="32" value="{{ l.desc }}" aria-label="Descrizione" required></td><td class="till-qty"><button type="button" class="ghost small" data-till-qty="-1" aria-label="Uno in meno">−</button><input name="qty" type="number" min="1" max="99" value="{{ l.qty|default:1 }}" inputmode="numeric" aria-label="Quantità"><button type="button" class="ghost small" data-till-qty="1" aria-label="Uno in più">+</button></td><td><input name="price" inputmode="decimal" value="{{ l.price }}" aria-label="Prezzo in euro" required></td><td><input name="off" value="{{ l.off|default:'' }}" maxlength="8" placeholder="0" aria-label="Sconto della riga, in euro o con il %"></td><td><select name="staff" aria-label="Chi l'ha fatto, solo per lo storico del cliente"><option value="">—</option>{% for n in staff_names %}<option{% if l and l.staff == n or not l and n == default_staff %} selected{% endif %}>{{ n }}</option>{% endfor %}</select></td><td><input type="hidden" name="svc" value="{{ l.svc }}"><button type="button" class="ghost small" data-till-remove aria-label="Togli la riga">×</button></td></tr>
