<tr><td><input name="desc" maxlength="120" value="{{ l.desc|default:'' }}" aria-label="Descrizione" required><input type="hidden" name="ref" value="{{ l.ref|default:'' }}"><input type="hidden" name="save" value=""></td><td class="till-qty"><input name="qty" type="number" min="1" max="99" value="{{ l.qty|default:1 }}" inputmode="numeric" aria-label="Quantità"></td><td><input name="price" inputmode="decimal" value="{{ l.price|default:'' }}" aria-label="Prezzo in euro" placeholder="0,00"></td><td class="quote-amount" data-quote-amount>0,00 €</td><td class="till-row-end"><button type="button" class="ghost small till-park" data-quote-save aria-pressed="false"{% if l.ref %} hidden{% endif %} title="Dopo il salvataggio la riga è anche in Prodotti">Salva tra i prodotti</button><button type="button" class="ghost small" data-quote-remove aria-label="Togli la riga">×</button></td></tr>
