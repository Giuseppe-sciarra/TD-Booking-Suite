<svg class="bars" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{% if chart.daily %}Prenotazioni confermate per giorno{% else %}Prenotazioni ricevute per settimana{% endif %}"><line class="axis" x1="0" x2="{{ chart.width }}" y1="{{ chart.base }}" y2="{{ chart.base }}"/>{% for b in chart.bars %}<g><title>{% if chart.daily %}{{ b.label }}{% else %}Settimana dal {{ b.label }}{% endif %}: {{ b.v }} prenotazion{{ b.v|pluralize:"e,i" }}</title>{% if b.v %}{% if b.href %}<a href="{{ b.href }}">{% endif %}<rect x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="5"/><text class="value" x="{{ b.lx }}" y="{{ b.ty }}">{{ b.v }}</text>{% if b.href %}</a>{% endif %}{% else %}<rect class="zero" x="{{ b.x }}" y="{{ b.zy }}" width="{{ b.w }}" height="3" rx="1.5"/>{% endif %}{% if b.show %}<text class="label" x="{{ b.lx }}" y="{{ chart.ly }}">{{ b.label }}</text>{% endif %}</g>{% endfor %}</svg>{% if chart.empty %}<p class="muted chart-empty">Ancora nessuna prenotazione in queste settimane</p>{% endif %}
