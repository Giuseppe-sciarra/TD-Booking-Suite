<tr{% if l.park %} class="is-parked"{% endif %}><td class="till-desc"><input name="desc" maxlength="32" value="{{ l.desc }}" aria-label="Descrizione"><input type="hidden" name="staff" value="{% if l %}{{ l.staff }}{% else %}{{ default_staff }}{% endif %}"><span class="till-who" data-till-who>{% if l %}{{ l.staff|default:"Operatore?" }}{% else %}{{ default_staff|default:"Operatore?" }}{% endif %}</span></td><td class="till-qty"><button type="button" class="ghost small" data-till-qty="-1" aria-label="Uno in meno">−</button><input name="qty" type="number" min="1" max="99" value="{{ l.qty|default:1 }}" inputmode="numeric" aria-label="Quantità"><button type="button" class="ghost small" data-till-qty="1" aria-label="Uno in più">+</button></td><td><input name="price" inputmode="decimal" value="{{ l.price }}" aria-label="Prezzo in euro"></td><td><input name="off" value="{{ l.off|default:'' }}" maxlength="8" placeholder="0" aria-label="Sconto della riga, in euro o con il %"></td><td class="till-park-cell"><input type="hidden" name="park" value="{% if l.park %}1{% endif %}"><button type="button" class="till-park" data-till-park aria-pressed="{% if l.park %}true{% else %}false{% endif %}" title="Fatto, non nello scontrino: va nella scheda del cliente e si paga un'altra volta"><span class="till-park-box" aria-hidden="true"></span>Non nello scontrino</button></td><td class="till-row-end"><input type="hidden" name="svc" value="{{ l.svc }}"><button type="button" class="ghost small" data-till-remove aria-label="Togli la riga">×</button></td></tr>
