{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagine">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&from={{ start|date:'Y-m-d' }}&to={{ end|date:'Y-m-d' }}&email={{ search|urlencode }}">← Precedente</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&from={{ start|date:'Y-m-d' }}&to={{ end|date:'Y-m-d' }}&email={{ search|urlencode }}">Successiva →</a>{% endif %}</nav>{% endif %}
