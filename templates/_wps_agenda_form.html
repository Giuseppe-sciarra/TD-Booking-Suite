<form method="post" action="{% url 'setup_action' tenant.slug %}">{% csrf_token %}<input type="hidden" name="action" value="wps_agenda">{% if a %}<input type="hidden" name="id" value="{{ a.id }}">{% endif %}<div class="form-grid"><div><label for="wpa-label-{{ a.id|default:'new' }}">Nome</label><input id="wpa-label-{{ a.id|default:'new' }}" name="label" value="{{ a.label|default:'' }}" maxlength="60" required placeholder="Per esempio Titolare, Anna"></div><div><label for="wpa-pw-{{ a.id|default:'new' }}">Password</label><input id="wpa-pw-{{ a.id|default:'new' }}" name="password" type="password" minlength="10" autocomplete="new-password" placeholder="{% if a %}Vuota: resta quella di prima{% else %}Vuota: la crea il programma{% endif %}"></div></div><ul class="check-list"><li><label class="check"><input type="radio" name="scope" value="all"{% if not a or a.all %} checked{% endif %}><span>Tutta l'attività</span></label></li><li><label class="check"><input type="radio" name="scope" value="some"{% if a and not a.all %} checked{% endif %}><span>Solo gli operatori scelti</span></label></li>{% for id,name in wps.people.items %}<li><label class="check"><input type="checkbox" name="resources" value="{{ id }}"{% if a and id in a.resources %} checked{% endif %}><span>{{ name }}</span></label></li>{% endfor %}</ul><div class="actions"><button class="primary small">{% if a %}Salva{% else %}Crea l'accesso{% endif %}</button></div></form>
