name: Plugin WordPress

# The plugin zip (wordpress/td-booking-suite -> td-booking-suite-<versione>.zip) attached to the release of its
# version: when a release is published, or by hand (workflow_dispatch) for the release that already exists.
# Publishing stays the user's: nothing here creates a release. The sites update from this asset (plugin self-update).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the asset on the release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Versione e zip
        id: zip
        run: |
          set -eu
          VERSION=$(sed -n 's/^ \* Version: *\([0-9][0-9.]*\).*/\1/p' wordpress/td-booking-suite/td-booking-suite.php | head -1)
          [ -n "$VERSION" ] || { echo "::error::Version mancante nell'intestazione del plugin"; exit 1; }
          grep -q "Stable tag: $VERSION" wordpress/td-booking-suite/readme.txt || { echo "::error::readme.txt: Stable tag diverso da $VERSION"; exit 1; }
          mkdir -p dist
          ( cd wordpress && zip -q -r -X "../dist/td-booking-suite-$VERSION.zip" td-booking-suite -x '*/__pycache__/*' '*.pyc' '.DS_Store' )
          sha256sum "dist/td-booking-suite-$VERSION.zip" | tee "dist/td-booking-suite-$VERSION.zip.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Allega al rilascio
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.zip.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          # by hand: the release of the plugin's version, tagged "2.22.0" or "v2.22.0"
          if [ -z "$TAG" ]; then
            for t in "$VERSION" "v$VERSION"; do
              if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then TAG="$t"; break; fi
            done
          fi
          [ -n "$TAG" ] || { echo "::error::Nessun rilascio $VERSION: crealo prima (Releases > Draft a new release), poi rilancia"; exit 1; }
          case "${TAG#v}" in "$VERSION") ;; *) echo "::warning::Il rilascio $TAG non ha la versione del plugin ($VERSION): lo zip va allegato lo stesso" ;; esac
          gh release upload "$TAG" dist/*.zip dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
