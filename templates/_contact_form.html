<form method="post" class="contact-form">{% csrf_token %}<input type="hidden" name="action" value="contact"><input type="hidden" name="index" value="{{ index }}"><div class="form-grid"><div><label for="cn{{ index }}">Nome e cognome</label><input id="cn{{ index }}" name="name" value="{{ c.name }}" maxlength="100" required></div><div><label for="cr{{ index }}">Ruolo</label><input id="cr{{ index }}" name="role" value="{{ c.role }}" maxlength="80" placeholder="Titolare, marketing, amministrazione"></div><div><label for="ce{{ index }}">Email</label><input id="ce{{ index }}" name="email" type="email" value="{{ c.email }}" maxlength="160"></div><div><label for="cp{{ index }}">Telefono</label><input id="cp{{ index }}" name="phone" type="tel" value="{{ c.phone }}" maxlength="40"></div><div class="span-two"><label for="cx{{ index }}">Note</label><input id="cx{{ index }}" name="notes" value="{{ c.notes }}" maxlength="300" placeholder="Orari in cui risponde, a cosa pensa"></div></div><label class="check"><input type="checkbox" name="primary"{% if c.primary %} checked{% endif %}> Referente principale, compare nell'elenco dei clienti</label><div class="actions"><button class="primary">{% if index == "" %}Aggiungi il referente{% else %}Salva il referente{% endif %}</button></div></form>
